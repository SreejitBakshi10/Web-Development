<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linked List Treasure Hunt Game</title>
  
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Font Awesome CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <div class="container text-center mt-5">
    <h1 class="display-4 mb-4">Linked List Treasure Hunt Game</h1>
    
    <div id="game-container" class="card p-4 shadow-lg">
      <div class="mb-4" id="lives-container"></div> <!-- Lives Display -->
      <div id="linked-list" class="d-flex flex-wrap justify-content-center mb-4"></div>
      
      <!-- Controls -->
      <div id="controls" class="btn-group mb-3" role="group">
        <button class="btn btn-primary" onclick="addNode()">
          <i class="fas fa-plus-circle"></i> Add Node
        </button>
        <button class="btn btn-danger" onclick="deleteNode()">
          <i class="fas fa-trash-alt"></i> Delete Node
        </button>
        <button class="btn btn-secondary" onclick="previousNode()">
          <i class="fas fa-arrow-left"></i> Previous
        </button>
        <button class="btn btn-secondary" onclick="nextNode()">
          Next <i class="fas fa-arrow-right"></i>
        </button>
        <button class="btn btn-success" onclick="checkTreasure()">
          <i class="fas fa-search"></i> Check Treasure
        </button>
      </div>

      <button class="btn btn-warning" onclick="startOver()">
        <i class="fas fa-redo"></i> Start Over
      </button>
    </div>
  </div>
  
  <!-- Custom Script -->
  <script src="script.js"></script>
</body>
</html>
